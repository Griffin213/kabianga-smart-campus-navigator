<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Announcements | UOK Admin</title>


<style>

/* =========================================================
   UOK ADMIN — ANNOUNCEMENT MANAGEMENT
   ========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f7fb;
    color:#172033;
}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{

    position:fixed;

    left:0;
    top:0;

    width:250px;
    height:100vh;

    background:
        linear-gradient(
            180deg,
            #075fd5,
            #0647a5
        );

    color:white;

    padding:25px 15px;

    z-index:1000;

    overflow-y:auto;

}


.sidebar h2{

    text-align:center;

    font-size:22px;

    margin-bottom:30px;

}


.sidebar a{

    display:block;

    color:white;

    text-decoration:none;

    padding:13px 16px;

    margin:5px 0;

    border-radius:10px;

    font-size:15px;

}


.sidebar a:hover,
.sidebar a.active{

    background:
        rgba(255,255,255,.18);

}


.sidebar .logout{

    margin-top:30px;

    background:
        rgba(0,0,0,.15);

}


/* =========================================================
   MAIN
   ========================================================= */

.main{

    margin-left:250px;

    min-height:100vh;

    padding:30px;

}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    background:white;

    padding:20px 25px;

    border-radius:16px;

    margin-bottom:25px;

    box-shadow:
        0 4px 18px
        rgba(0,0,0,.05);

}


.topbar h1{

    color:#075dcc;

    font-size:27px;

}


.topbar p{

    color:#697386;

    margin-top:5px;

    font-size:14px;

}


.menu-btn{

    display:none;

    border:none;

    background:#075dcc;

    color:white;

    padding:10px 14px;

    border-radius:8px;

    font-size:20px;

}


/* =========================================================
   WORKSPACE
   ========================================================= */

.workspace{

    display:grid;

    grid-template-columns:
        minmax(0,1.35fr)
        minmax(300px,.8fr);

    gap:25px;

    align-items:start;

}


/* =========================================================
   CARD
   ========================================================= */

.card{

    background:white;

    border-radius:18px;

    padding:28px;

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.06);

    margin-bottom:25px;

}


.card h2{

    color:#075dcc;

    font-size:22px;

    margin-bottom:8px;

}


.card-subtitle{

    color:#777;

    margin-bottom:23px;

    font-size:14px;

}


/* =========================================================
   FORM
   ========================================================= */

label.form-label{

    display:block;

    font-weight:bold;

    font-size:14px;

    margin:19px 0 8px;

}


.optional{

    color:#8a94a5;

    font-size:11px;

    font-weight:normal;

}


input,
textarea,
select{

    width:100%;

    border:
        1px solid
        #d9e0ea;

    border-radius:10px;

    padding:13px;

    font-size:14px;

    outline:none;

    font-family:inherit;

    background:#fbfcfe;

}


textarea{

    min-height:145px;

    resize:vertical;

}


input:focus,
textarea:focus,
select:focus{

    border-color:#075dcc;

    box-shadow:
        0 0 0 3px
        rgba(7,93,204,.08);

}


/* =========================================================
   TYPE SELECTOR
   ========================================================= */

.type-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

    margin-top:10px;

}


.type-option{

    position:relative;

}


.type-option input{

    position:absolute;

    opacity:0;

}


.type-option label{

    display:block;

    padding:13px 8px;

    text-align:center;

    border:
        1px solid
        #dce3ed;

    border-radius:12px;

    background:#fafcff;

    cursor:pointer;

    font-size:12px;

    font-weight:bold;

}


.type-option input:checked + label{

    background:#edf5ff;

    border-color:#075dcc;

    color:#075dcc;

}


/* =========================================================
   PRIORITY
   ========================================================= */

.priority-grid{

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:10px;

}


.priority-option{

    position:relative;

}


.priority-option input{

    position:absolute;

    opacity:0;

}


.priority-option label{

    display:block;

    padding:11px;

    text-align:center;

    border:
        1px solid
        #dce3ed;

    border-radius:10px;

    cursor:pointer;

    font-size:12px;

    font-weight:bold;

}


.priority-option input:checked + label{

    border-color:#075dcc;

    background:#edf5ff;

    color:#075dcc;

}


/* =========================================================
   UPLOAD BOX
   ========================================================= */

.upload-box{

    border:
        2px dashed
        #75a9e8;

    border-radius:14px;

    padding:25px 15px;

    text-align:center;

    background:
        linear-gradient(
            135deg,
            #f5f9ff,
            #eef6ff
        );

    cursor:pointer;

    margin-top:10px;

    transition:
        0.25s ease;

}


.upload-box:hover{

    border-color:#075dcc;

    background:#eaf3ff;

    transform:translateY(-1px);

}


.upload-box:active{

    transform:scale(0.99);

}


.upload-box .icon{

    font-size:38px;

    margin-bottom:8px;

}


.upload-box h3{

    color:#075dcc;

    margin-bottom:6px;

    font-size:17px;

}


.upload-box p{

    color:#777;

    font-size:13px;

    line-height:1.5;

}


/* =========================================================
   HIDDEN PHOTO INPUT
   ========================================================= */

#photoInput{

    display:none;

}


/* =========================================================
   PHOTO PREVIEW GRID
   ========================================================= */

.preview-images{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(110px,1fr)
        );

    gap:10px;

    margin-top:15px;

}


/* =========================================================
   PHOTO PREVIEW ITEM
   ========================================================= */

.preview-item{

    position:relative;

}


.preview-item img{

    width:100%;

    height:110px;

    object-fit:cover;

    border-radius:10px;

    border:1px solid #e0e7f0;

}


/* =========================================================
   REMOVE PHOTO BUTTON
   ========================================================= */

.remove-photo{

    position:absolute;

    top:5px;

    right:5px;

    border:none;

    background:#dc3545;

    color:white;

    width:25px;

    height:25px;

    border-radius:50%;

    cursor:pointer;

    font-size:16px;

    line-height:25px;

    padding:0;

}


/* =========================================================
   ANNOUNCEMENT IMAGE
   ========================================================= */

.announcement-photo{

    width:100%;

    max-height:320px;

    object-fit:cover;

    border-radius:12px;

    margin-top:12px;

    display:block;

}


/* =========================================================
   MULTIPLE ANNOUNCEMENT PHOTOS
   ========================================================= */

.announcement-images{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(140px,1fr)
        );

    gap:10px;

    margin-top:15px;

}


.announcement-images .announcement-photo{

    height:150px;

    object-fit:cover;

    margin-top:0;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:500px){

    .upload-box{

        padding:20px 12px;

    }


    .upload-box .icon{

        font-size:34px;

    }


    .upload-box h3{

        font-size:16px;

    }


    .upload-box p{

        font-size:12px;

    }


    .preview-item img{

        height:100px;

    }

}
