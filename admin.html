<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administrator Login | UoK</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#075dcc,#0647a5);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:390px;
    background:#fff;
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 45px rgba(0,0,0,.25);
    text-align:center;
}

.logo{
    width:85px;
    height:85px;
    object-fit:contain;
    margin-bottom:12px;
}

h2{
    color:#075dcc;
    margin-bottom:6px;
}

.subtitle{
    color:#687386;
    font-size:14px;
    margin-bottom:25px;
}

.secure{
    color:#16803c;
    font-weight:bold;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:1px solid #dce3ec;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#075dcc;
    box-shadow:0 0 0 3px rgba(7,93,204,.10);
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    background:#075dcc;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#0647a5;
}

button:disabled{
    background:#8aa9d8;
    cursor:not-allowed;
}

#message{
    margin-top:15px;
    font-size:14px;
    min-height:20px;
}

.footer{
    margin-top:25px;
    color:#777;
    font-size:12px;
    line-height:1.7;
}

.names{
    color:#075dcc;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="login-box">

    <img src="logo.jpg"
         class="logo"
         alt="University of Kabianga Logo">

    <h2>University of Kabianga</h2>

    <p class="subtitle">
        Smart Campus Management System
    </p>

    <p class="secure">
        🔒 Secure Administrator Login
    </p>

    <input
        type="email"
        id="email"
        placeholder="📧 Administrator Email"
        autocomplete="email"
    >

    <input
        type="password"
        id="password"
        placeholder="🔑 Password"
        autocomplete="current-password"
    >

    <button id="loginButton">
        🔵 Login
    </button>

    <div id="message"></div>

    <div class="footer">

        © 2026 University of Kabianga<br>
        Smart Campus Management System

        <br><br>

        Developed by

        <div class="names">
            Griffin Kipruttoh<br>
            David Dodi
        </div>

    </div>

</div>


<script type="module">

import { auth } from "./firebase.js";

import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");


loginButton.addEventListener("click", async function(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    if(!email || !password){

        message.style.color = "#d9273f";

        message.innerHTML =
            "⚠️ Please enter your email and password.";

        return;
    }


    loginButton.disabled = true;

    loginButton.innerHTML =
        "⏳ Signing in...";

    message.innerHTML = "";


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        message.style.color = "#16803c";

        message.innerHTML =
            "✅ Login successful. Opening dashboard...";


        setTimeout(function(){

            window.location.href =
                "dashboard.html";

        },700);


    }catch(error){

        console.error("LOGIN ERROR:",error);

        message.style.color = "#d9273f";

        if(error.code === "auth/invalid-credential"){

            message.innerHTML =
                "❌ Incorrect email or password.";

        }else if(error.code === "auth/invalid-email"){

            message.innerHTML =
                "❌ Please enter a valid email address.";

        }else if(error.code === "auth/too-many-requests"){

            message.innerHTML =
                "⚠️ Too many attempts. Please try again later.";

        }else{

            message.innerHTML =
                "❌ Login failed: " + error.message;

        }

        loginButton.disabled = false;

        loginButton.innerHTML =
            "🔵 Login";

    }

});


/* Allow pressing ENTER to login */

passwordInput.addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        loginButton.click();

    }

});


<script type="module">

import { auth } from "./firebase.js";

import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");


loginButton.addEventListener("click", async function () {

    const email = emailInput.value.trim();
    const password = passwordInput.value;


    // ================================
    // CHECK INPUT
    // ================================

    if (!email || !password) {

        message.style.color = "#d9273f";

        message.innerHTML =
            "⚠️ Please enter your email and password.";

        return;
    }


    // ================================
    // START LOGIN
    // ================================

    loginButton.disabled = true;

    loginButton.innerHTML =
        "⏳ Signing in...";

    message.style.color = "#687386";

    message.innerHTML =
        "Connecting to Firebase...";


    try {

        console.log("================================");
        console.log("🔐 UOK ADMIN LOGIN");
        console.log("================================");

        console.log("Email:", email);
        console.log("Firebase Auth:", auth);


        // =========================================
        // FIREBASE LOGIN
        // =========================================

        const loginPromise =
            signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        // =========================================
        // 15 SECOND TIMEOUT
        // =========================================

        const timeoutPromise =
            new Promise((_, reject) => {

                setTimeout(() => {

                    reject({
                        code: "login-timeout",
                        message:
                            "Firebase did not respond within 15 seconds."
                    });

                }, 15000);

            });


        const result =
            await Promise.race([
                loginPromise,
                timeoutPromise
            ]);


        // =========================================
        // LOGIN SUCCESS
        // =========================================

        console.log("✅ LOGIN SUCCESS");
        console.log("User:", result.user);


        message.style.color = "#16803c";

        message.innerHTML =
            "✅ Login successful. Opening dashboard...";


        loginButton.innerHTML =
            "✅ Logged In";


        // =========================================
        // OPEN DASHBOARD
        // =========================================

        setTimeout(function () {

            window.location.href =
                "./dashboard.html";

        }, 700);


    } catch (error) {

        console.error("================================");
        console.error("❌ LOGIN ERROR");
        console.error("================================");

        console.error("Error code:", error.code);
        console.error("Error message:", error.message);


        message.style.color = "#d9273f";


        // =========================================
        // TIMEOUT
        // =========================================

        if (error.code === "login-timeout") {

            message.innerHTML =
                "❌ Firebase is not responding. Check your internet connection or Firebase configuration.";

        }


        // =========================================
        // WRONG LOGIN
        // =========================================

        else if (
            error.code === "auth/invalid-credential" ||
            error.code === "auth/wrong-password"
        ) {

            message.innerHTML =
                "❌ Incorrect email or password.";

        }


        // =========================================
        // USER DOES NOT EXIST
        // =========================================

        else if (
            error.code === "auth/user-not-found"
        ) {

            message.innerHTML =
                "❌ Administrator account was not found.";

        }


        // =========================================
        // INVALID EMAIL
        // =========================================

        else if (
            error.code === "auth/invalid-email"
        ) {

            message.innerHTML =
                "❌ Invalid email address.";

        }


        // =========================================
        // UNAUTHORIZED DOMAIN
        // =========================================

        else if (
            error.code === "auth/unauthorized-domain"
        ) {

            message.innerHTML =
                "❌ This website is not authorized in Firebase.";

        }


        // =========================================
        // TOO MANY ATTEMPTS
        // =========================================

        else if (
            error.code === "auth/too-many-requests"
        ) {

            message.innerHTML =
                "⚠️ Too many login attempts. Try again later.";

        }


        // =========================================
        // OTHER ERROR
        // =========================================

        else {

            message.innerHTML =
                "❌ Firebase Error: " +
                (error.message || "Unknown error");

        }


        // =========================================
        // RESET BUTTON
        // =========================================

        loginButton.disabled = false;

        loginButton.innerHTML =
            "🔵 Login";

    }

});


// =========================================
// ENTER KEY LOGIN
// =========================================

passwordInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            loginButton.click();

        }

    }
);

</script>
</body>
</html>
