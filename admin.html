<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Administrator Login | University of Kabianga</title>

<meta name="theme-color"
      content="#075dcc">

<style>

/* =====================================================
   GENERAL
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:
        linear-gradient(
            135deg,
            #075dcc,
            #0647a5
        );

}


/* =====================================================
   LOGIN BOX
===================================================== */

.login-box{

    width:100%;

    max-width:390px;

    background:#ffffff;

    padding:30px 25px;

    border-radius:18px;

    box-shadow:
        0 18px 45px
        rgba(0,0,0,.22);

    text-align:center;

}


/* =====================================================
   LOGO
===================================================== */

.logo{

    width:78px;

    height:78px;

    object-fit:contain;

    margin-bottom:12px;

}


/* =====================================================
   HEADINGS
===================================================== */

h2{

    color:#075dcc;

    font-size:20px;

    margin-bottom:6px;

}

h4{

    color:#697386;

    font-size:12px;

    font-weight:500;

    margin-bottom:22px;

}


.secure{

    color:#16803c;

    font-size:12px;

    font-weight:700;

    margin-bottom:15px;

}


/* =====================================================
   INPUTS
===================================================== */

.input-group{

    position:relative;

    margin:10px 0;

}

.input-group span{

    position:absolute;

    left:13px;

    top:50%;

    transform:translateY(-50%);

    font-size:15px;

}

input{

    width:100%;

    padding:13px 13px 13px 40px;

    border:1px solid #dce3ec;

    border-radius:10px;

    font-size:14px;

    outline:none;

    background:#f9fbfe;

    transition:.2s ease;

}

input:focus{

    border-color:#075dcc;

    background:#ffffff;

    box-shadow:
        0 0 0 3px
        rgba(7,93,204,.08);

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

button{

    width:100%;

    min-height:46px;

    margin-top:15px;

    background:#075dcc;

    color:white;

    border:none;

    border-radius:10px;

    font-size:14px;

    font-weight:700;

    cursor:pointer;

    transition:.2s ease;

}

button:hover{

    background:#0647a5;

}

button:disabled{

    opacity:.7;

    cursor:not-allowed;

}


/* =====================================================
   ERROR / STATUS
===================================================== */

.status{

    min-height:18px;

    margin-top:12px;

    font-size:11px;

    line-height:1.5;

}

.error{

    color:#d9273f;

}

.success{

    color:#16803c;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    margin-top:22px;

    padding-top:15px;

    border-top:1px solid #edf1f6;

    font-size:9px;

    color:#8a94a6;

    line-height:1.7;

}

.names{

    font-weight:bold;

    color:#075dcc;

    margin-top:3px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:400px){

    body{

        padding:14px;

    }

    .login-box{

        padding:25px 18px;

    }

    .logo{

        width:70px;

        height:70px;

    }

    h2{

        font-size:18px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<div class="login-box">


    <img
        src="logo.jpg"
        alt="University of Kabianga Logo"
        class="logo"
    >


    <h2>
        University of Kabianga
    </h2>


    <h4>
        Smart Campus Management System
    </h4>


    <p class="secure">
        🔒 Secure Administrator Login
    </p>


    <!-- EMAIL -->

    <div class="input-group">

        <span>📧</span>

        <input
            type="email"
            id="email"
            placeholder="Administrator Email"
            autocomplete="username"
        >

    </div>


    <!-- PASSWORD -->

    <div class="input-group">

        <span>🔑</span>

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
        >

    </div>


    <!-- LOGIN -->

    <button
        id="loginButton"
        type="button"
    >

        🔐 Login

    </button>


    <!-- STATUS -->

    <div
        id="status"
        class="status"
    ></div>


    <!-- FOOTER -->

    <div class="footer">

        © 2026 University of Kabianga<br>

        Smart Campus Management System

        <br><br>

        Developed by

        <div class="names">

            Griffin Kipruttoh<br>

            David Dodi

        </div>

    </div>


</div>



<!-- =====================================================
     FIREBASE AUTHENTICATION
===================================================== -->

<script type="module">

import { auth }
from "./firebase.js";

import {
    signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";


const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const status =
    document.getElementById("status");


/* =====================================================
   LOGIN
===================================================== */

async function loginAdmin(){

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;


    status.textContent = "";

    status.className = "status";


    if(!email){

        status.textContent =
            "Please enter your administrator email.";

        status.classList.add("error");

        return;

    }


    if(!password){

        status.textContent =
            "Please enter your password.";

        status.classList.add("error");

        return;

    }


    loginButton.disabled = true;

    loginButton.textContent =
        "⏳ Signing in...";


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        status.textContent =
            "✅ Login successful. Opening dashboard...";

        status.classList.add("success");


        setTimeout(function(){

            window.location.href =
                "dashboard.html";

        },700);


    }catch(error){

        console.error(
            "Login error:",
            error
        );


        status.classList.remove(
            "success"
        );

        status.classList.add(
            "error"
        );


        if(
            error.code ===
            "auth/invalid-credential"
        ){

            status.textContent =
                "❌ Invalid email or password.";

        }else if(
            error.code ===
            "auth/too-many-requests"
        ){

            status.textContent =
                "⚠️ Too many attempts. Please try again later.";

        }else{

            status.textContent =
                "❌ Login failed. Please try again.";

        }


        loginButton.disabled = false;

        loginButton.textContent =
            "🔐 Login";

    }

}


/* =====================================================
   BUTTON
===================================================== */

loginButton.addEventListener(
    "click",
    loginAdmin
);


/* =====================================================
   ENTER KEY
===================================================== */

passwordInput.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            loginAdmin();

        }

    }
);

</script>


</body>

</html>
