<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0b5ed7">

    <title>Prince AI | UOK Smart Campus</title>

    <link rel="stylesheet" href="style.css?v=3">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef5ff;
            min-height: 100vh;
        }

        .top-header {
            background: linear-gradient(135deg, #0b5ed7, #084298);
            color: white;
            padding: 18px 15px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .top-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .top-header p {
            margin: 6px 0 0;
            font-size: 14px;
            opacity: 0.95;
        }

        .page-container {
            width: 100%;
            max-width: 700px;
            margin: auto;
            padding: 15px;
        }

        .ai-card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.12);
            overflow: hidden;
            margin-top: 10px;
        }

        .ai-header {
            background: linear-gradient(135deg, #0b5ed7, #084298);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .ai-icon {
            font-size: 45px;
            margin-bottom: 5px;
        }

        .ai-header h2 {
            margin: 5px 0;
            font-size: 25px;
        }

        .ai-header p {
            margin: 5px 0;
            font-size: 14px;
        }

        #chatBox {
            height: 55vh;
            min-height: 350px;
            overflow-y: auto;
            padding: 15px;
            background: #f7faff;
        }

        .message {
            max-width: 85%;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-message {
            margin-left: auto;
            background: #0b5ed7;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            margin-right: auto;
            background: white;
            color: #222;
            border: 1px solid #dce7f7;
            border-bottom-left-radius: 4px;
        }

        .bot-message a {
            text-decoration: none;
        }

        .input-area {
            padding: 12px;
            background: white;
            border-top: 1px solid #ddd;
        }

        .input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #userMessage {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 2px solid #d8e2f0;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
        }

        #userMessage:focus {
            border-color: #0b5ed7;
        }

        .action-btn {
            border: none;
            border-radius: 12px;
            min-width: 48px;
            height: 48px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #voiceBtn {
            background: #198754;
            color: white;
        }

        #voiceBtn.listening {
            background: #dc3545;
        }

        #sendBtn {
            background: #0b5ed7;
            color: white;
        }

        .bottom-buttons {
            display: flex;
            gap: 10px;
            padding: 12px;
            background: white;
        }

        .bottom-buttons button {
            flex: 1;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        #backBtn {
            background: #6c757d;
            color: white;
        }

        #newChatBtn {
            background: #198754;
            color: white;
        }

        .navigate-btn {
            display: inline-block;
            background: #198754;
            color: white !important;
            padding: 10px 15px;
            margin-top: 10px;
            border-radius: 9px;
            font-weight: bold;
        }

        .welcome-message {
            text-align: center;
            color: #555;
            padding: 15px;
        }

        @media (max-width: 500px) {
            .top-header h1 {
                font-size: 20px;
            }

            .ai-header h2 {
                font-size: 22px;
            }

            #chatBox {
                height: 52vh;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

<header class="top-header">
    <h1>UNIVERSITY OF KABIANGA</h1>
    <p>Smart Campus Navigation System</p>
</header>

<div class="page-container">

    <div class="ai-card">

        <div class="ai-header">
            <div class="ai-icon">🤖</div>

            <h2>Prince AI</h2>

            <p>
                Your University of Kabianga Smart Campus Assistant
            </p>
        </div>

        <div id="chatBox">

            <div class="welcome-message">
                <strong>Welcome to Prince AI 👋</strong>
                <br><br>

                Ask me about:
                <br>
                📍 Campus locations
                <br>
                🏫 LTB buildings
                <br>
                👨‍💼 University leadership
                <br>
                🧭 Navigation
                <br>
                🎓 University information
            </div>

        </div>

        <div class="input-area">

            <div class="input-row">

                <input
                    type="text"
                    id="userMessage"
                    placeholder="Ask Prince AI..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="voiceBtn"
                    class="action-btn"
                    title="Use microphone"
                >
                    🎤
                </button>

                <button
                    type="button"
                    id="sendBtn"
                    class="action-btn"
                    title="Send message"
                >
                    ➤
                </button>

            </div>

        </div>

        <div class="bottom-buttons">

            <button
                type="button"
                id="backBtn"
            >
                ← Back
            </button>

            <button
                type="button"
                id="newChatBtn"
            >
                + New Chat
            </button>

        </div>

    </div>

</div>

<!-- IMPORTANT:
     knowledge.js must load BEFORE prince-ai.js
-->

<script src="knowledge.js?v=4"></script>
<script src="prince-ai.js?v=4"></script>

</body>
</html>
