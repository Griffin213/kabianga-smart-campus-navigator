<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prince AI | University of Kabianga</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eef5ff;
    min-height: 100vh;
    color: #222;
}

/* =========================
   HEADER
========================= */

header {
    background: linear-gradient(135deg, #0b5ed7, #084298);
    color: white;
    text-align: center;
    padding: 22px 15px;
}

header h1 {
    font-size: 24px;
    margin-bottom: 6px;
}

header p {
    font-size: 14px;
}

/* =========================
   MAIN
========================= */

.container {
    width: 95%;
    max-width: 700px;
    margin: 20px auto;
}

/* =========================
   AI CARD
========================= */

.ai-card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

.ai-title {
    text-align: center;
    color: #0b5ed7;
    margin-bottom: 8px;
    font-size: 28px;
}

.status {
    text-align: center;
    color: green;
    font-size: 14px;
    margin-bottom: 15px;
}

/* =========================
   CHAT AREA
========================= */

.chat-box {
    height: 380px;
    overflow-y: auto;
    background: #f7f9fc;
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 15px;
}

.message {
    margin-bottom: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    line-height: 1.5;
    word-wrap: break-word;
}

.bot {
    background: #e8f1ff;
    border-left: 4px solid #0b5ed7;
}

.user {
    background: #dff5e5;
    border-left: 4px solid #198754;
    text-align: right;
}

/* =========================
   QUICK QUESTIONS
========================= */

.quick-title {
    font-weight: bold;
    margin-bottom: 8px;
}

.quick-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 15px;
}

.quick-buttons button {
    background: #eef5ff;
    border: 1px solid #0b5ed7;
    color: #0b5ed7;
    padding: 9px 12px;
    border-radius: 20px;
    cursor: pointer;
}

.quick-buttons button:hover {
    background: #0b5ed7;
    color: white;
}

/* =========================
   INPUT
========================= */

.input-area {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.input-area input {
    flex: 1;
    padding: 13px;
    border: 1px solid #bbb;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

.input-area input:focus {
    border-color: #0b5ed7;
}

.input-area button {
    border: none;
    border-radius: 10px;
    padding: 0 15px;
    cursor: pointer;
    font-size: 18px;
}

.mic-btn {
    background: #198754;
    color: white;
}

.send-btn {
    background: #0b5ed7;
    color: white;
}

/* =========================
   ACTION BUTTONS
========================= */

.actions {
    display: flex;
    gap: 10px;
}

.actions button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
}

.clear-btn {
    background: #dc3545;
    color: white;
}

.back-btn {
    background: #6c757d;
    color: white;
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    padding: 20px;
    color: #555;
    font-size: 13px;
}

    header h1 {
        font-size: 20px;
    }

    .ai-title {
        font-size: 24px;
