<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prince AI | University of Kabianga</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eef5ff;
    color: #222;
}

header {
    background: linear-gradient(135deg, #0b5ed7, #084298);
    color: white;
    text-align: center;
    padding: 20px 15px;
}

header img {
    width: 80px;
    height: 80px;
    object-fit: contain;
    border-radius: 50%;
    background: white;
    padding: 5px;
    margin-bottom: 10px;
}

header h1 {
    font-size: 22px;
}

header p {
    font-size: 14px;
    margin-top: 5px;
}

.container {
    max-width: 700px;
    margin: 20px auto;
    padding: 0 15px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.ai-title {
    text-align: center;
    color: #084298;
    margin-bottom: 8px;
}

.intro {
    text-align: center;
    font-size: 14px;
    margin-bottom: 15px;
    color: #555;
}

.status {
    text-align: center;
    background: #eef5ff;
    color: #084298;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-size: 13px;
}

.chat-box {
    height: 390px;
    overflow-y: auto;
    border: 1px solid #d9e2f0;
    border-radius: 12px;
    padding: 12px;
    background: #f8fbff;
    margin-bottom: 15px;
}

.message {
    padding: 10px 13px;
    border-radius: 12px;
    margin-bottom: 10px;
    max-width: 90%;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
}

.bot {
    background: #e4efff;
    color: #123;
    margin-right: auto;
}

.user {
    background: #0b5ed7;
    color: white;
    margin-left: auto;
}

.quick-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 8px;
    color: #084298;
}

.quick-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 15px;
}

.quick-buttons button {
    background: #eaf2ff;
    border: 1px solid #b8d0f5;
    color: #084298;
    border-radius: 20px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 12px;
}

.quick-buttons button:hover {
    background: #d4e5ff;
}

.input-area {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

#userInput {
    flex: 1;
    padding: 13px;
    border: 1px solid #ccd8e8;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
}

#userInput:focus {
    border-color: #0b5ed7;
}

button {
    font-family: inherit;
}

.send-btn,
.mic-btn,
.clear-btn,
.back-btn {
    border: none;
    border-radius: 10px;
    padding: 11px 14px;
    cursor: pointer;
    font-weight: bold;
}

.send-btn {
    background: #0b5ed7;
    color: white;
}

.mic-btn {
    background: #198754;
    color: white;
}

.clear-btn {
    background: #dc3545;
    color: white;
}

.back-btn {
    background: #6c757d;
    color: white;
}

.send-btn:active,
.mic-btn:active,
.clear-btn:active,
.back-btn:active {
    transform: scale(0.97);
}

.action-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.action-buttons button {
    flex: 1;
    min-width: 130px;
}

.version {
    text-align: center;
    font-size: 11px;
    color: #777;
    margin-top: 12px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #666;
    font-size: 12px;
}

@media (max-width: 500px) {
    .input-area {
        flex-wrap: wrap;
    }

    #userInput {
        flex-basis: 100%;
    }

    .send-btn,
    .mic-btn {
        flex: 1;
    }
