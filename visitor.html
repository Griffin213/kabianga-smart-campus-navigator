/* ================================
   GENERAL
================================ */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #eef5ff, #ffffff);
    color: #222;
    min-height: 100vh;
}


/* ================================
   HEADER
================================ */

header {
    background: linear-gradient(135deg, #0b5ed7, #084298);
    color: white;
    padding: 18px;
    text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.2);
}

header img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    border-radius: 50%;
    background: white;
    padding: 5px;
    margin-bottom: 8px;
}

header h1 {
    font-size: 21px;
    margin-bottom: 5px;
}

header p {
    font-size: 13px;
    opacity: 0.9;
}


/* ================================
   CONTAINER
================================ */

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}


/* ================================
   WELCOME
================================ */

.welcome {
    background: white;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.welcome h2 {
    color: #084298;
    margin-bottom: 10px;
}

.welcome p {
    color: #555;
    line-height: 1.6;
}


/* ================================
   SEARCH
================================ */

.search-box {
    margin: 20px 0;
}

.search-box input {
    width: 100%;
    padding: 15px;
    border: 2px solid #dbe5f5;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

.search-box input:focus {
    border-color: #0b5ed7;
}


/* ================================
   MENU BUTTONS
================================ */

.menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 15px;
    margin-bottom: 25px;
}

.menu-btn {
    border: none;
    padding: 18px 10px;
    border-radius: 12px;
    background: white;
    color: #084298;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    transition: 0.3s;
}

.menu-btn:hover {
    background: #0b5ed7;
    color: white;
    transform: translateY(-3px);
}

.menu-btn span {
    display: block;
    font-size: 25px;
    margin-bottom: 8px;
}


/* ================================
   VISITOR SIGN-IN LINK
================================ */

.visitor-signin-link {
    text-decoration: none;
    display: block;
    width: 100%;
}

.visitor-signin-link .menu-btn {
    width: 100%;
}


/* ================================
   SECTIONS
================================ */

.section {
    display: none;
    background: white;
    padding: 22px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.section h2 {
    color: #084298;
    margin-bottom: 15px;
    border-bottom: 2px solid #eef5ff;
    padding-bottom: 10px;
}


/* ================================
   OFFICE CARDS
================================ */

.office-card {
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 12px;
    background: #fafcff;
}

.office-card h3 {
    color: #0b5ed7;
    margin-bottom: 6px;
}

.office-card p {
    color: #555;
    font-size: 14px;
    margin-bottom: 8px;
}
